<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1714;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Arial, sans-serif;
    padding: 30px 0 60px;
  }

  .title-block {
    color: #888;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0.6;
  }

  .wall {
    position: relative;
    width: 960px;
    height: 1320px;
    background-color: #2e2924;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px);
    box-shadow: inset 0 0 120px rgba(0,0,0,0.5), 0 0 40px rgba(0,0,0,0.8);
    overflow: hidden;
    border: 1px solid #111;
  }

  /* Grime / wear layers */
  .wall::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,200,100,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(100,150,255,0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.15) 100%);
    pointer-events: none;
    z-index: 200;
  }

  .sticker {
    position: absolute;
    font-family: Arial Black, Arial, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1;
    display: inline-block;
    white-space: nowrap;
    cursor: default;
    transition: transform 0.15s ease, z-index 0s;
  }

  .sticker:hover {
    z-index: 100 !important;
    filter: brightness(1.15);
  }

  /* Size variants */
  .s-xxl { font-size: 36px; padding: 14px 26px; }
  .s-xl  { font-size: 26px; padding: 11px 20px; }
  .s-lg  { font-size: 19px; padding: 9px 15px; }
  .s-md  { font-size: 14px; padding: 7px 12px; }
  .s-sm  { font-size: 11px; padding: 5px 9px; }

  /* Color schemes */
  .c-red    { background: #c41e1e; color: #fff; }
  .c-crimson{ background: #7a0000; color: #f0c8c8; }
  .c-black  { background: #111111; color: #f0ede5; }
  .c-white  { background: #f0ede5; color: #111; border: 2px solid #333; }
  .c-yellow { background: #f0c800; color: #111; }
  .c-orange { background: #c84800; color: #fff; }
  .c-teal   { background: #1a6b5a; color: #d0ede8; }
  .c-navy   { background: #1a2f5e; color: #c8d8f0; }
  .c-grey   { background: #4a4640; color: #c8c0b8; opacity: 0.72; }
  .c-cream  { background: #ddd5b8; color: #2a2215; border: 1.5px solid #a09070; }
  .c-hot    { background: #e0003c; color: #fff; }
  .c-lime   { background: #7aaa00; color: #111; }
  .c-purple { background: #4a1a7a; color: #ddc8f5; }
  .c-rust   { background: #8a3200; color: #f0d0b8; }
  .c-ink    { background: #0d1a2e; color: #88aacc; border: 1px solid #334; }

  /* Shape variants */
  .r-rect   { border-radius: 3px; }
  .r-round  { border-radius: 8px; }
  .r-pill   { border-radius: 100px; }
  .r-sharp  { border-radius: 0; }
  .r-torn   { border-radius: 2px 8px 3px 7px; }

  /* Wear effects */
  .worn     { opacity: 0.68; filter: saturate(0.7); }
  .fresh    { box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .peel     { box-shadow: 2px 3px 10px rgba(0,0,0,0.6); border-radius: 3px 4px 2px 8px; }
  .flat     { box-shadow: none; }
